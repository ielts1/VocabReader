      # ---------------------------------------------------------
      # 16. Generate Gradle wrapper
      # ---------------------------------------------------------
      - name: Generate Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.9


      # ---------------------------------------------------------
      # 17. Make wrapper executable
      # ---------------------------------------------------------
      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          chmod +x ./gradlew


      # ---------------------------------------------------------
      # 18. Build debug APK
      # ---------------------------------------------------------
      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon clean assembleDebug


      # ---------------------------------------------------------
      # 19. Rename APK
      # ---------------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/VocabReader-AutoPopup-V2.0-debug.apk


      # ---------------------------------------------------------
      # 20. Upload APK as GitHub Actions artifact
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VocabReader-AutoPopup-V2.0-APK
          path: output/VocabReader-AutoPopup-V2.0-debug.apk
          if-no-files-found: error
